<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
  <defs>
    <style>
      text {
        font-family: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      .bg { fill: #f8f9fa; }
      .header-title { font-size: 34px; font-weight: 700; fill: #1a202c; }
      .header-subtitle { font-size: 20px; fill: #4a5568; }
      .header-subtitle-bold { font-weight: 700; fill: #1a202c; }
      .category-text { font-size: 22px; fill: #1a202c; font-weight: 400; }
      .temp-text { font-size: 22px; fill: #1a202c; font-weight: 400; font-variant-numeric: tabular-nums; }
      .footer-text { font-size: 14px; fill: #718096; }
      .pyramid-text { font-size: 22px; fill: #ffffff; font-weight: 400; dominant-baseline: central; }
      .pyramid-line { stroke: #ffffff; stroke-width: 2; }
      .guide-line { stroke: #a0aec0; stroke-width: 2; stroke-dasharray: 4 6; }
    </style>
    <filter id="pyramidShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a202c" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" class="bg" />

  <!-- Header -->
  <text x="50" y="70" class="header-title">ExaPolymer</text>
  <text x="50" y="105" class="header-subtitle">Классификация <tspan class="header-subtitle-bold">инженерных</tspan> пластиков ExaPolymer</text>

  <!-- Left Column: Categories, Dotted Lines, Temperatures -->
  <!-- Level 1 -->
  <circle cx="55" cy="196" r="6" fill="#e8523a" />
  <text x="75" y="200" dominant-baseline="middle" class="category-text">Специальные</text>
  <line x1="230" y1="200" x2="425" y2="200" class="guide-line" />
  <text x="440" y="200" dominant-baseline="middle" class="temp-text">300°C</text>

  <!-- Level 2 -->
  <circle cx="55" cy="296" r="6" fill="#ef7d3f" />
  <text x="75" y="300" dominant-baseline="middle" class="category-text">Высокотемпературные</text>
  <line x1="320" y1="300" x2="425" y2="300" class="guide-line" />
  <text x="440" y="300" dominant-baseline="middle" class="temp-text">200°C</text>

  <!-- Level 3 -->
  <circle cx="55" cy="396" r="6" fill="#147d70" />
  <text x="75" y="400" dominant-baseline="middle" class="category-text">Инженерные</text>
  <line x1="220" y1="400" x2="425" y2="400" class="guide-line" />
  <text x="440" y="400" dominant-baseline="middle" class="temp-text">150°C</text>

  <!-- Level 4 -->
  <circle cx="55" cy="496" r="6" fill="#2ea28c" />
  <text x="75" y="500" dominant-baseline="middle" class="category-text">Конструкционные</text>
  <line x1="265" y1="500" x2="425" y2="500" class="guide-line" />
  <text x="440" y="500" dominant-baseline="middle" class="temp-text">100°C</text>

  <!-- Level 5 (no temperature) -->
  <circle cx="55" cy="596" r="6" fill="#3b82c6" />
  <text x="75" y="600" dominant-baseline="middle" class="category-text">Универсальные</text>

  <!-- Pyramid -->
  <g filter="url(#pyramidShadow)">
    <!-- Level 1 (Top, undivided) -->
    <polygon points="750,100 810,200 690,200" fill="#e8523a" />

    <!-- Level 2 -->
    <polygon points="690,200 810,200 870,300 630,300" fill="#ef7d3f" />

    <!-- Level 3 -->
    <polygon points="630,300 870,300 930,400 570,400" fill="#147d70" />

    <!-- Level 4 -->
    <polygon points="570,400 930,400 990,500 510,500" fill="#2ea28c" />

    <!-- Level 5 (Bottom) -->
    <polygon points="510,500 990,500 1050,600 450,600" fill="#2f8fae" />
  </g>

  <!-- Pyramid Inner Divider Lines -->
  <line x1="690" y1="200" x2="810" y2="200" class="pyramid-line" />
  <line x1="630" y1="300" x2="870" y2="300" class="pyramid-line" />
  <line x1="570" y1="400" x2="930" y2="400" class="pyramid-line" />
  <line x1="510" y1="500" x2="990" y2="500" class="pyramid-line" />

  <!-- Vertical Divider (From Level 2 to Level 5) -->
  <line x1="750" y1="200" x2="750" y2="600" class="pyramid-line" />

  <!-- Pyramid Text (each block: x = analytic horizontal center of its trapezoid, y = vertical center via dominant-baseline: central) -->
  <!-- Level 1 (apex, centroid-weighted y) -->
  <text x="750" y="155" text-anchor="middle" class="pyramid-text">
    <tspan x="750" dy="0">LCP,</tspan>
    <tspan x="750" dy="25">PBI, PI</tspan>
  </text>

  <!-- Level 2 -->
  <text x="705" y="250" text-anchor="middle" class="pyramid-text">PAI</text>
  <text x="795" y="225" text-anchor="middle" class="pyramid-text">
    <tspan x="795" dy="0">PEEK,</tspan>
    <tspan x="795" dy="25">PPS,</tspan>
    <tspan x="795" dy="25">PTFE</tspan>
  </text>

  <!-- Level 3 -->
  <text x="675" y="338" text-anchor="middle" class="pyramid-text">
    <tspan x="675" dy="0">PEI,</tspan>
    <tspan x="675" dy="25">PES</tspan>
  </text>
  <text x="825" y="325" text-anchor="middle" class="pyramid-text">
    <tspan x="825" dy="0">PFA,</tspan>
    <tspan x="825" dy="25">POK,</tspan>
    <tspan x="825" dy="25">PPSU</tspan>
  </text>

  <!-- Level 4 -->
  <text x="645" y="450" text-anchor="middle" class="pyramid-text">PET, PPO</text>
  <text x="855" y="438" text-anchor="middle" class="pyramid-text">
    <tspan x="855" dy="0">PA6, PA66,</tspan>
    <tspan x="855" dy="25">PBT, PET, POM</tspan>
  </text>

  <!-- Level 5 -->
  <text x="615" y="550" text-anchor="middle" class="pyramid-text">ABS, PS</text>
  <text x="885" y="538" text-anchor="middle" class="pyramid-text">
    <tspan x="885" dy="0">PP, PE,</tspan>
    <tspan x="885" dy="25">PVC, ABS, PMMA</tspan>
  </text>

  <!-- Footer -->
  <text x="50" y="670" class="footer-text">Значения ориентировочные и зависят от марки и наполнения материала.</text>
</svg>
